<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Automated Minecraft Kit Delivery Bot for 2b2t, 6b6t, and Java anarchy servers. Manage TPA & Elytra kit deliveries with real-time web dashboard." />
    <meta name="keywords" content="minecraft kit delivery bot, 2b2t kit bot, 6b6t delivery bot, anarchy server kit bot, mineflayer delivery bot, automated kit bot, minecraft shop bot, elytra delivery bot" />
    <meta name="theme-color" content="#141313" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Minecraft Kit Delivery Bot (MDB) - 2b2t & Anarchy Kit Bot</title>
    <style>
      /* Scale entire website to 85% on mobile */
      @media screen and (max-width: 768px) {
        html {
          zoom: 0.85;
        }
        body {
          overflow: hidden;
          position: fixed;
          width: 100%;
          height: 100%;
          -webkit-touch-callout: none;
          -webkit-user-select: none;
          user-select: none;
        }
      }
    </style>
    <script>
      /* Prevent pinch zoom on iOS */
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); });
      /* Prevent double-tap zoom */
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, false);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
